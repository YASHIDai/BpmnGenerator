<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #161921;
    --surface2: #1e2230;
    --border: #2a2f3d;
    --accent: #4f9cf9;
    --accent2: #7c5cfc;
    --success: #3ecf8e;
    --warn: #f97316;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  header h1 { font-size: 14px; font-weight: 500; }
  header .sub { font-size: 11px; color: var(--text-muted); }
  .badge {
    margin-left: auto; font-size: 10px; padding: 2px 8px;
    background: rgba(79,156,249,0.12); color: var(--accent);
    border: 1px solid rgba(79,156,249,0.25); border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
  }

  .main { display: flex; flex: 1; overflow: hidden; }

  .panel-left {
    width: 320px; flex-shrink: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--surface);
  }
  .panel-section { padding: 14px; border-bottom: 1px solid var(--border); }
  .label {
    font-size: 10px; font-weight: 500; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px;
  }
  textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: 'Noto Sans JP', sans-serif; font-size: 12px;
    line-height: 1.7; padding: 10px; resize: none; outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-muted); }

  .examples { display: flex; flex-direction: column; gap: 5px; margin-top: 7px; }
  .example-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text-muted);
    font-size: 11px; font-family: 'Noto Sans JP', sans-serif;
    padding: 6px 10px; text-align: left; cursor: pointer; transition: all 0.15s;
  }
  .example-btn:hover { border-color: var(--accent); color: var(--text); }

  .generate-btn {
    width: 100%; padding: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: var(--radius); color: #fff;
    font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: opacity 0.2s, transform 0.1s;
  }
  .generate-btn:hover { opacity: 0.9; }
  .generate-btn:active { transform: scale(0.98); }
  .generate-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .error-bar {
    display: none; margin-top: 8px; padding: 8px 12px;
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; font-size: 11px; color: #f87171;
  }

  .xml-panel { flex: 1; overflow-y: auto; padding: 14px; }
  .xml-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
  .copy-btn {
    font-size: 10px; padding: 3px 8px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted);
    cursor: pointer; font-family: 'JetBrains Mono', monospace; transition: all 0.15s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  pre#xml-output {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    line-height: 1.6; color: #a5b4cc; white-space: pre-wrap;
    word-break: break-all; min-height: 60px;
  }

  .panel-right {
    flex: 1; display: flex; flex-direction: column;
    background: var(--bg); overflow: hidden;
  }
  .viewer-header {
    padding: 9px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); flex-shrink: 0;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted); transition: background 0.3s;
  }
  .status-dot.active { background: var(--success); box-shadow: 0 0 5px var(--success); }
  .status-dot.loading { background: var(--warn); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .viewer-title { font-size: 12px; color: var(--text-muted); }
  .fit-btn {
    margin-left: auto; font-size: 10px; padding: 3px 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-muted); cursor: pointer;
    font-family: 'JetBrains Mono', monospace; transition: all 0.15s;
  }
  .fit-btn:hover { border-color: var(--accent); color: var(--accent); }

  #bpmn-container { flex: 1; position: relative; overflow: hidden; background: #ffffff; }
  .empty-state {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: var(--text-muted); pointer-events: none;
  }
  .empty-state .icon { font-size: 40px; opacity: 0.25; }
  .empty-state p { font-size: 12px; }

  #bpmn-container .bjs-container { background: #ffffff !important; }
  #bpmn-container .djs-container svg { background: #ffffff !important; }
  .layout-toggle {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .layout-btn {
    flex: 1; padding: 6px 0; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-muted); font-size: 11px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .layout-btn:hover { border-color: var(--accent); color: var(--text); }
  .layout-btn.active {
    background: rgba(79,156,249,0.15);
    border-color: var(--accent); color: var(--accent);
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
<!-- importmap-->
<script type="importmap">
{
  "imports": {
    "bpmn-moddle": "./bpmn-moddle-wrapper.js",
    "graph-by-ivan-tulaev": "https://unpkg.com/graph-by-ivan-tulaev/dist/index.js",

<!-- bpmn-js -->
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/bpmn-js.css">
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/bpmn-font/css/bpmn.css">
<script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-navigated-viewer.production.min.js"></script>
</head>
<body>

<header>
  <div class="logo">?</div>
  <div>
    <h1>BPMN フロー生成ツール</h1>
    <div class="sub">日本語 → BPMN 2.0 XML → リアルタイム描画</div>
  </div>
  <div class="badge">bpmn-js powered</div>
</header>

<div class="main">
  <div class="panel-left">
    <div class="panel-section">
      <div class="label">業務フローの説明</div>
      <textarea id="prompt" rows="7" placeholder="例：顧客から注文を受け付け、在庫を確認する。在庫がある場合は出荷処理を行い、ない場合は調達部門へ発注する…"></textarea>
      <div class="label" style="margin-top:10px;">サンプル</div>
      <div class="examples">
        <button class="example-btn" onclick="loadExample(0)">  届出手続フロー（転入届）</button>
        <button class="example-btn" onclick="loadExample(1)">  証明書発行請求フロー（住民票の写し）</button>
        <button class="example-btn" onclick="loadExample(2)">  許認可申請フロー（飲食店営業許可）</button>
      </div>
    </div>
    <div class="panel-section">
      <div class="label">レイアウト方向</div>
      <div class="layout-toggle">
        <button class="layout-btn active" id="btn-horizontal" onclick="setLayout('horizontal')">? 横（左→右）</button>
        <button class="layout-btn" id="btn-vertical" onclick="setLayout('vertical')">? 縦（上→下）</button>
      </div>
    </div>
    <div class="panel-section">
      <button class="generate-btn" id="gen-btn" onclick="generate()">? BPMN を生成する</button>
      <div class="error-bar" id="error-bar"></div>
    </div>
    <div class="xml-panel">
      <div class="xml-header">
        <div class="label" style="margin:0">生成された BPMN 2.0 XML</div>
        <button class="copy-btn" onclick="copyXml(event)">コピー</button>
      </div>
      <pre id="xml-output">// ここにXMLが表示されます</pre>
    </div>
  </div>

  <div class="panel-right">
    <div class="viewer-header">
      <div class="status-dot" id="status-dot"></div>
      <span class="viewer-title" id="viewer-title">フローを生成してください</span>
      <button class="fit-btn" onclick="fitView()">全体表示</button>
    </div>
    <div id="bpmn-container">
      <div class="empty-state" id="empty-state">
        <div class="icon">?</div>
        <p>左のパネルで業務フローを説明して生成してください</p>
      </div>
    </div>
  </div>
</div>



<script type="module">
const examples = [
`届出手続フロー（転入届）：
1. 住民が窓口・郵送・オンラインで届出書類を提出する
2. 市民課受付担当者が書類の記載内容・添付書類を確認する
3. 不備がある場合は住民に差し戻し・補正を依頼する
4. 不備がない場合は内容をシステムに入力・登録する
5. 関連部門（国民健康保険・国民年金・児童手当など）へ情報を連携する
6. 必要に応じて住民票・マイナンバーカードの住所変更等の手続きを案内する
7. 届出受理を住民に通知して完了`,
`証明書発行請求フロー（住民票の写し）：
1. 住民が窓口・郵送・オンライン・コンビニで請求書を提出する
2. 市民課受付担当者が本人確認書類・委任状（代理の場合）を確認する
3. 本人確認が取れない場合は請求を受け付けず、理由を説明して返却する
4. 本人確認が取れた場合は請求内容をシステムで確認する
5. 手数料を徴収する（窓口の場合は現金・電子決済、郵送の場合は定額小為替等）
6. システムから証明書を発行・印刷する
7. 内容を確認・押印のうえ、住民に交付して完了`,
`許認可申請フロー（飲食店営業許可）：
1. 申請者が事前相談を行い、生活衛生課担当者が必要書類・要件を案内する
2. 申請者が申請書・添付書類（施設の図面・食品衛生責任者資格証明等）を提出する
3. 受付担当者が書類の記載内容・添付書類の過不足を確認する
4. 不備がある場合は申請者に補正を依頼する
5. 書類審査が完了したら現地調査（施設検査）の日程を調整する
6. 担当者が施設へ赴き、設備・衛生管理状況等を確認する
7. 基準を満たさない場合は改善指導を行い、再検査を実施する
8. 基準を満たした場合は許可書を作成・決裁する
9. 申請者に許可書を交付して完了`,
];

function loadExample(i) { document.getElementById('prompt').value = examples[i]; }

let layoutMode = 'horizontal'; // 'horizontal' | 'vertical'

function setLayout(mode) {
  layoutMode = mode;
  document.getElementById('btn-horizontal').classList.toggle('active', mode === 'horizontal');
  document.getElementById('btn-vertical').classList.toggle('active', mode === 'vertical');
}

let viewer = null;

window.addEventListener('load', function() {
  viewer = new BpmnJS({ container: '#bpmn-container' });
});

function initViewer() {
  if (!viewer) {
    viewer = new BpmnJS({ container: '#bpmn-container' });
  }
}

const SYSTEM_PROMPT = `あなたはBPMN 2.0の専門家です。ユーザーが日本語で説明した業務プロセスを、有効なBPMN 2.0準拠のXMLに変換してください。

## 最重要ルール
- XMLのみ出力すること。説明文・コードブロック記号（\`\`\`）は一切含めないこと
- 全要素に bpmn2: プレフィックスを付けること（bpmndi: / dc: / di: はそのまま）
- 全要素に一意の id（英数字）と name（日本語可）を付与すること

## 名前空間（必ず以下をそのまま使うこと）
<?xml version="1.0" encoding="UTF-8"?>
<bpmn2:definitions
  xmlns:bpmn2="http://www.omg.org/spec/BPMN/20100524/MODEL"
  xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
  xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
  xmlns:di="http://www.omg.org/spec/DD/20100524/DI"
  id="Definitions_1"
  targetNamespace="http://example.com/bpmn">

## レイアウト方向の判断ルール
ユーザーのプロンプトに以下のキーワードが含まれる場合に対応するレイアウトを選択すること：
- 「縦」「上から下」「トップダウン」「縦書き」→ 縦レイアウト（Top to Bottom）
- 「横」「左から右」「横書き」またはキーワードなし → 横レイアウト（Left to Right）

---

## 【横レイアウト】Left to Right（デフォルト）

### 通常フロー（担当者1名）の座標ルール
- 要素をx座標方向（左→右）に並べる
- 開始イベント: x="80" y="200"
- 各要素のx間隔: タスク120px、ゲートウェイ100px

### スイムレーン（担当者2名以上）の座標ルール
- isHorizontal="true" を指定
- Participantサイズ: width="800" height="160"
- Participantをy座標でずらして縦に並べる
  - Participant_1: x="80" y="80"
  - Participant_2: x="80" y="240"
  - Participant_3: x="80" y="400"
- 各レーン内タスクはx方向（左→右）に並べる

### 横レイアウトのサンプル（スイムレーンあり）
<?xml version="1.0" encoding="UTF-8"?>
<bpmn2:definitions
  xmlns:bpmn2="http://www.omg.org/spec/BPMN/20100524/MODEL"
  xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
  xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
  xmlns:di="http://www.omg.org/spec/DD/20100524/DI"
  id="Definitions_1" targetNamespace="http://example.com/bpmn">
  <bpmn2:collaboration id="Collaboration_1">
    <bpmn2:participant id="Participant_1" name="顧客" processRef="Process_1"/>
    <bpmn2:participant id="Participant_2" name="営業部門" processRef="Process_2"/>
  </bpmn2:collaboration>
  <bpmn2:process id="Process_1" isExecutable="false">
    <bpmn2:startEvent id="Start_1" name="注文"/>
    <bpmn2:endEvent id="End_1" name="受取"/>
    <bpmn2:sequenceFlow id="Flow_1" sourceRef="Start_1" targetRef="End_1"/>
  </bpmn2:process>
  <bpmn2:process id="Process_2" isExecutable="false">
    <bpmn2:startEvent id="Start_2" name="受注"/>
    <bpmn2:task id="Task_1" name="在庫確認"/>
    <bpmn2:endEvent id="End_2" name="出荷完了"/>
    <bpmn2:sequenceFlow id="Flow_2" sourceRef="Start_2" targetRef="Task_1"/>
    <bpmn2:sequenceFlow id="Flow_3" sourceRef="Task_1" targetRef="End_2"/>
  </bpmn2:process>
  <bpmndi:BPMNDiagram id="BPMNDiagram_1">
    <bpmndi:BPMNPlane bpmnElement="Collaboration_1">
      <bpmndi:BPMNShape bpmnElement="Participant_1" isHorizontal="true">
        <dc:Bounds x="80" y="80" width="800" height="160"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape bpmnElement="Participant_2" isHorizontal="true">
        <dc:Bounds x="80" y="240" width="800" height="160"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape bpmnElement="Start_1">
        <dc:Bounds x="180" y="142" width="36" height="36"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape bpmnElement="End_1">
        <dc:Bounds x="700" y="142" width="36" height="36"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape bpmnElement="Start_2">
        <dc:Bounds x="180" y="302" width="36" height="36"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape bpmnElement="Task_1">
        <dc:Bounds x="300" y="280" width="100" height="80"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape bpmnElement="End_2">
        <dc:Bounds x="700" y="302" width="36" height="36"/>
      </bpmndi:BPMNShape>
      <bpmndi:BPMNEdge bpmnElement="Flow_1">
        <di:waypoint x="216" y="160"/>
        <di:waypoint x="700" y="160"/>
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge bpmnElement="Flow_2">
        <di:waypoint x="216" y="320"/>
        <di:waypoint x="300" y="320"/>
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge bpmnElement="Flow_3">
        <di:waypoint x="400" y="320"/>
        <di:waypoint x="700" y="320"/>
      </bpmndi:BPMNEdge>
    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn2:definitions>

## 【縦レイアウト】Top to Bottom

### 通常フロー（担当者1名）の座標ルール
- 要素をy座標方向（上→下）に並べる
- 基準x座標: 300（中央揃え）
- 開始イベント: x="282" y="80"
- タスクのy間隔: 120px
- 分岐後の並列タスクはx座標をずらして横並び（例: x="150" と x="400"）

### スイムレーン（担当者2名以上）の座標ルール
- isHorizontal="false" を指定
- Participantサイズ: width="160" height="600"
- Participantをx座標でずらして横に並べる
  - Participant_1: x="80"  y="80"
  - Participant_2: x="240" y="80"
  - Participant_3: x="400" y="80"
- 各レーン内タスクはy方向（上→下）に並べる

### 縦レイアウトのサンプル（スイムレーンなし）
<?xml version="1.0" encoding="UTF-8"?>
<bpmn2:definitions
  xmlns:bpmn2="http://www.omg.org/spec/BPMN/20100524/MODEL"
  xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI"
  xmlns:dc="http://www.omg.org/spec/DD/20100524/DC"
  xmlns:di="http://www.omg.org/spec/DD/20100524/DI"
  id="Definitions_1" targetNamespace="http://example.com/bpmn">
  <bpmn2:process id="Process_1" isExecutable="false">
    <bpmn2:startEvent id="Start_1" name="開始"/>
    <bpmn2:task id="Task_1" name="申請書作成"/>
    <bpmn2:exclusiveGateway id="GW_1" name="承認？"/>
    <bpmn2:task id="Task_2" name="承認処理"/>
    <bpmn2:task id="Task_3" name="差し戻し"/>
    <bpmn2:endEvent id="End_1" name="完了"/>
    <bpmn2:sequenceFlow id="Flow_1" sourceRef="Start_1" targetRef="Task_1"/>
    <bpmn2:sequenceFlow id="Flow_2" sourceRef="Task_1" targetRef="GW_1"/>
    <bpmn2:sequenceFlow id="Flow_3" name="承認" sourceRef="GW_1" targetRef="Task_2"/>
    <bpmn2:sequenceFlow id="Flow_4" name="否認" sourceRef="GW_1" targetRef="Task_3"/>
    <bpmn2:sequenceFlow id="Flow_5" sourceRef="Task_2" targetRef="End_1"/>
    <bpmn2:sequenceFlow id="Flow_6" sourceRef="Task_3" targetRef="End_1"/>
  </bpmn2:process>
  <bpmndi:BPMNDiagram id="BPMNDiagram_1">
    <bpmndi:BPMNPlane bpmnElement="Process_1">
      <bpmndi:BPMNShape bpmnElement="Start_1">
        <dc:Bounds x="282" y="80" width="36" height="36"/>

## スイムレーンの共通ルール
- ユーザーの説明に担当者・部門・役割が2つ以上登場する場合は必ずスイムレーン形式で出力すること
- collaboration と participant を必ず定義すること
- 参加者ごとに独立した process を定義すること
- BPMNDiagramのbpmnElementは必ず Collaboration_1 を指定すること

## ② フローの種類（最重要・厳守）
- 同一Participant内のフロー → 必ず bpmn2:sequenceFlow を使うこと
- 異なるParticipant間のフロー → 必ず bpmn2:messageFlow を使うこと（sequenceFlowは絶対に使わない）
- messageFlowは collaboration 要素の内側に定義すること（process内ではない）
- BPMNEdgeのmessageFlowには必ず messageVisibleKind="non_initiating" を設定すること

## messageFlowの記述例
<bpmn2:collaboration id="Collaboration_1">
  <bpmn2:participant id="Participant_1" name="担当A" processRef="Process_1"/>
  <bpmn2:participant id="Participant_2" name="担当B" processRef="Process_2"/>
  <!-- 異なるParticipant間は必ずmessageFlow -->
  <bpmn2:messageFlow id="MsgFlow_1" sourceRef="Task_A1" targetRef="Task_B1" name="通知"/>
</bpmn2:collaboration>

## 通常フロー要素のサイズ
- タスク: width="100" height="80"
- ゲートウェイ: width="50" height="50"
- イベント: width="36" height="36"`;

async function generate() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;

  initViewer();

  const btn = document.getElementById('gen-btn');
  const dot = document.getElementById('status-dot');
  const title = document.getElementById('viewer-title');
  const errorBar = document.getElementById('error-bar');

  btn.disabled = true;
  btn.textContent = '? 生成中…';
  dot.className = 'status-dot loading';
  title.textContent = 'BPMN XML を生成中…';
  errorBar.style.display = 'none';

  // Dify API 設定
  // レイアウト指示をプロンプトに付加（強制指定）
  const layoutInstruction = layoutMode === 'vertical'
    ? '\n\n【必須・レイアウト指定】\n' +
      '- フローは必ず上から下（Top to Bottom）に配置すること\n' +
      '- x座標方向には並べず、y座標方向に要素を並べること\n' +
      '- スイムレーンを使う場合はisHorizontal="false"を設定し、Participantをx方向に並べること\n' +
      '- Participantサイズ: width="160" height="700"'
    : '\n\n【必須・レイアウト指定】\n' +
      '- フローは必ず左から右（Left to Right）に配置すること\n' +
      '- y座標方向には並べず、x座標方向に要素を並べること\n' +
      '- スイムレーンを使う場合はisHorizontal="true"を設定し、Participantをy方向に並べること\n' +
      '- Participantサイズ: width="900" height="160"';
  const promptWithLayout = prompt + layoutInstruction;

  const DIFY_API_KEY = 'app-Zk8VZaLzzi3XQELdSa7sA1ft';
  const DIFY_API_URL = 'https://api.dify.ai/v1/workflows/run';

  // Exponential backoffでリトライ
  const MAX_RETRIES = 4;
  const BASE_DELAY = 2000; // 2秒

  async function fetchWithRetry(retryCount = 0) {
    const response = await fetch(DIFY_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${DIFY_API_KEY}`,
      },
      body: JSON.stringify({
        inputs: { business_flow: promptWithLayout },
        response_mode: 'streaming',
        user: 'bpmn-user'
      })
    });

    // 529(Overloaded) / 504(Timeout) の場合はリトライ
    if ((response.status === 529 || response.status === 504) && retryCount < MAX_RETRIES) {
      const delay = BASE_DELAY * Math.pow(2, retryCount); // 2秒, 4秒, 8秒, 16秒
      title.textContent = `サーバー混雑中… ${retryCount + 1}回目リトライ（${delay/1000}秒後）`;
      await new Promise(resolve => setTimeout(resolve, delay));
      return fetchWithRetry(retryCount + 1);
    }

    if (!response.ok) {
      const errBody = await response.text().catch(() => '');
      throw new Error(`API Error: ${response.status} ${errBody}`);
    }
    return response;
  }

  try {
    const response = await fetchWithRetry();

    // streamingモード: SSEを読み取りworkflow_finishedイベントでXMLを取得
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let xml = '';

    title.textContent = 'ノード処理中…';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // 未完了行を次のループへ

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6).trim();
        if (!jsonStr || jsonStr === '[DONE]') continue;

        try {
          const event = JSON.parse(jsonStr);

          // ノード完了時にステータスを更新
          if (event.event === 'node_finished' && event.data?.title) {
            title.textContent = `${event.data.title} 完了…`;
          }

          // ワークフロー完了時にXMLを取得
          if (event.event === 'workflow_finished') {
            const outputs = event.data?.outputs;
            if (outputs) {
              // 出力変数名を順番に探す
              xml = outputs.text || outputs.xml || outputs.result
                 || Object.values(outputs).find(v => typeof v === 'string' && v.includes('bpmn2:')) || '';
            }
          }
        } catch (e) {
          // JSON parseエラーは無視
        }
      }
    }

    if (!xml) throw new Error('XMLが取得できませんでした。Difyの出力変数を確認してください。');

    xml = xml.replace(/^```xml\n?/, '').replace(/^```\n?/, '').replace(/\n?```$/, '').trim();
    title.textContent = 'レイアウト計算中…';
    xml = await applyAutoLayout(xml);

    document.getElementById('xml-output').textContent = xml;
    title.textContent = 'レンダリング中…';

    await viewer.importXML(xml);
    document.getElementById('empty-state').style.display = 'none';
    dot.className = 'status-dot active';
    title.textContent = '生成完了 ?';
    fitView();

  } catch (err) {
    dot.className = 'status-dot';
    title.textContent = 'エラーが発生しました';
    errorBar.style.display = 'block';
    errorBar.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '? BPMN を生成する';
  }
}

// ============================================
// SequenceFlow の outgoing/incoming を補完
// ============================================
function enrichSequenceFlows(xml) {
  const parser = new DOMParser();
  const serializer = new XMLSerializer();
  const doc = parser.parseFromString(xml, 'application/xml');

  doc.querySelectorAll('sequenceFlow').forEach(flow => {
    const sourceId = flow.getAttribute('sourceRef');
    const targetId = flow.getAttribute('targetRef');
    const flowId   = flow.getAttribute('id');

    // sourceRef の要素に <outgoing> を追加
    const sourceElem = doc.querySelector(`[id="${sourceId}"]`);
    if (sourceElem) {
      const alreadyHas = [...sourceElem.querySelectorAll('outgoing')]
        .some(o => o.textContent.trim() === flowId);
      if (!alreadyHas) {
        const outgoing = doc.createElementNS(
          sourceElem.namespaceURI, 'bpmn2:outgoing'
        );
        outgoing.textContent = flowId;
        sourceElem.appendChild(outgoing);
      }
    }

    // targetRef の要素に <incoming> を追加
    const targetElem = doc.querySelector(`[id="${targetId}"]`);
    if (targetElem) {
      const alreadyHas = [...targetElem.querySelectorAll('incoming')]
        .some(i => i.textContent.trim() === flowId);
      if (!alreadyHas) {
        const incoming = doc.createElementNS(
          targetElem.namespaceURI, 'bpmn2:incoming'
        );
        incoming.textContent = flowId;
        targetElem.appendChild(incoming);
      }
    }
  });

  return serializer.serializeToString(doc);
}
  
// bpmn-auto-layoutを使った自動レイアウト
async function applyAutoLayout(xml) {
  try {
    const { BpmnModdle } = await import('bpmn-moddle');
    const layoutModule = await import(
      'https://unpkg.com/yet-another-bpmn-auto-layout@2.0.0/dist/index.js'
    );

    const enriched = enrichSequenceFlows(xml);

    // ① XML文字列 → moddleオブジェクト
    const moddle = new BpmnModdle();
    const { rootElement } = await moddle.fromXML(enriched);

    // ② layoutProcess にはmoddleオブジェクトを渡す
    await layoutModule.layoutProcess(rootElement, moddle);

    // ③ moddleオブジェクト → XML文字列
    const { xml: layoutedXml } = await moddle.toXML(rootElement, { format: true });

    // ④ 名前空間プレフィックスを正規化（ns0: / ns1: 等 → bpmn2: / bpmndi: 等）
    let result = normalizePrefixes(layoutedXml);

    result = normalizeToHorizontal(result);
    result = addSequenceFlowEdges(result);
    result = fixLaneLayout(result);
    result = fixMessageFlowEdges(result);
    result = fixCrossLaneXPositions(result);
    return result;
  } catch(e) {
    console.warn('autoLayout failed:', e);
    // フォールバック: DI情報がない場合はそのまま渡すと描画失敗するため
    // 最低限のDI情報をXMLに付与して返す
    try {
      return buildMinimalDi(xml);
    } catch(e2) {
      console.warn('buildMinimalDi also failed:', e2);
      return xml;
    }
  }
}

// ============================================
// ⑦ 縦レイアウトを横レイアウトに変換
//    layoutMode が 'vertical' の場合はスキップ
// ============================================
function normalizeToHorizontal(xml) {
  // ユーザーが縦レイアウトを選択している場合は変換しない
  if (layoutMode === 'vertical') return xml;

  const parser = new DOMParser();
  const serializer = new XMLSerializer();
  const doc = parser.parseFromString(xml, 'application/xml');

  // Participantのサイズで縦横を判定
  const firstParticipant = doc.querySelector('BPMNShape[bpmnElement^="Participant"]');
  if (!firstParticipant) return xml;

  const bounds = firstParticipant.querySelector('Bounds');
  const w = parseFloat(bounds.getAttribute('width'));
  const h = parseFloat(bounds.getAttribute('height'));

  // 縦長（height > width）なら横に変換が必要
  if (h <= w) return xml; // すでに横レイアウト

  // ① 全Participantの情報収集・ソート
  const participantShapes = [];
  doc.querySelectorAll('BPMNShape').forEach(shape => {
    const id = shape.getAttribute('bpmnElement') || '';
    const elem = doc.querySelector(`participant[id="${id}"]`)
               || doc.querySelector(`*|participant[id="${id}"]`);
    if (!elem) return;
    const b = shape.querySelector('Bounds');
    if (!b) return;
    participantShapes.push({
      id, shape, bounds: b,
      x: parseFloat(b.getAttribute('x')),
      y: parseFloat(b.getAttribute('y')),
      w: parseFloat(b.getAttribute('width')),
      h: parseFloat(b.getAttribute('height')),
    });
  });

  // Y座標でソート（上から順）
  participantShapes.sort((a, b) => a.y - b.y);

  // ② 各ParticipantのY→X変換後の新Y座標を計算
  let currentY = 0;
  const participantMap = new Map(); // id → { oldY, oldH, newY, newW, newH }
  participantShapes.forEach(p => {
    const newW = p.h; // 旧height → 新width
    const newH = p.w; // 旧width  → 新height
    participantMap.set(p.id, {
      oldY: p.y,
      oldH: p.h,
      oldX: p.x,
      oldW: p.w,
      newY: currentY,
      newW,
      newH,
    });
    currentY += newH + 70;
  });

  // ③ 座標変換ヘルパー
  // 縦レイアウトの(x,y) → 横レイアウトの(newX, newY)
  function transformPoint(origX, origY) {
    // どのParticipantに属するか判定
    for (const [, p] of participantMap) {
      if (origY >= p.oldY && origY <= p.oldY + p.oldH) {
        const relY = origY - p.oldY; // Participant内Y相対座標
        const relX = origX - 30;     // レーンラベル分を除いたX相対座標
        return {
          x: relY + 30,              // 縦のY相対 → 横のX
          y: p.newY + relX + 30,     // 縦のX相対 → 横のY
        };
      }
    }
    // Participantに属さない場合（単純X↔Y）
    return { x: origY, y: origX };
  }

  // ④ 全BPMNShapeを変換
  doc.querySelectorAll('BPMNShape').forEach(shape => {
    const id = shape.getAttribute('bpmnElement') || '';
    const b  = shape.querySelector('Bounds');
    if (!b) return;

    const x = parseFloat(b.getAttribute('x'));
    const y = parseFloat(b.getAttribute('y'));
    const w = parseFloat(b.getAttribute('width'));
    const h = parseFloat(b.getAttribute('height'));

    // Participantか判定
    const pInfo = participantMap.get(id);
    if (pInfo) {
      b.setAttribute('x', 0);
      b.setAttribute('y', pInfo.newY);
      b.setAttribute('width',  pInfo.newW);
      b.setAttribute('height', pInfo.newH);
      shape.setAttribute('isHorizontal', 'true');
      return;
    }

    // Laneか判定
    const laneElem = doc.querySelector(`lane[id="${id}"]`)
                  || doc.querySelector(`*|lane[id="${id}"]`);
    if (laneElem) {
      // LaneのParticipantを特定
      const parentPId = getLaneParticipantId(doc, id);
      const pI = parentPId ? participantMap.get(parentPId) : null;
      if (pI) {
        const relY = y - pI.oldY;
        const relX = x - 30;
        b.setAttribute('x', relY + 30);
        b.setAttribute('y', pI.newY + relX);
        b.setAttribute('width',  h);
        b.setAttribute('height', w);
      } else {
        b.setAttribute('x', y);
        b.setAttribute('y', x);
        b.setAttribute('width',  h);
        b.setAttribute('height', w);
      }
      shape.setAttribute('isHorizontal', 'true');
      return;
    }

    // Task / Gateway / Event
    const pt = transformPoint(x, y);
    b.setAttribute('x', pt.x);
    b.setAttribute('y', pt.y);
    b.setAttribute('width',  h);
    b.setAttribute('height', w);
  });

  // ⑤ 全BPMNEdgeのwaypointを変換
  doc.querySelectorAll('BPMNEdge').forEach(edge => {
    edge.querySelectorAll('waypoint').forEach(wp => {
      const x = parseFloat(wp.getAttribute('x'));
      const y = parseFloat(wp.getAttribute('y'));
      const pt = transformPoint(x, y);
      wp.setAttribute('x', pt.x);
      wp.setAttribute('y', pt.y);
    });
  });

  return serializer.serializeToString(doc);
}

// Laneが属するParticipantのIDを返す
function getLaneParticipantId(doc, laneId) {
  const participants = doc.querySelectorAll('[processRef]');
  for (const p of participants) {
    const processId = p.getAttribute('processRef');
    const process   = doc.querySelector(`[id="${processId}"]`);
    if (!process) continue;
    const lanes = process.querySelectorAll('lane');
    for (const lane of lanes) {
      if (lane.getAttribute('id') === laneId) {
        return p.getAttribute('id');
      }
    }
  }
  return null;
}

// ============================================
// レーンをまたぐ要素のX座標を補正する
// ============================================
function fixCrossLaneXPositions(xml) {
  const parser = new DOMParser();
  const serializer = new XMLSerializer();
  const doc = parser.parseFromString(xml, 'application/xml');
  const diNs = 'http://www.omg.org/spec/DD/20100524/DI';
  const MARGIN = 40;
  const LANE_LABEL_WIDTH = 30;
  const START_X = 80; // Lane内の開始X座標（ラベル幅分）

  // ① Boundsの読み書きヘルパー
  function getBounds(nodeId) {
    const shape = doc.querySelector(`BPMNShape[bpmnElement="${nodeId}"]`);
    if (!shape) return null;
    const b = shape.querySelector('Bounds');
    if (!b) return null;
    return {
      x: parseFloat(b.getAttribute('x')),
      y: parseFloat(b.getAttribute('y')),
      w: parseFloat(b.getAttribute('width')),
      h: parseFloat(b.getAttribute('height')),
    };
  }

  function setBounds(nodeId, x, y) {
    const shape = doc.querySelector(`BPMNShape[bpmnElement="${nodeId}"]`);
    if (!shape) return;
    const b = shape.querySelector('Bounds');
    if (!b) return;
    if (x !== null) b.setAttribute('x', x);
    if (y !== null) b.setAttribute('y', y);
  }

  // ② 各プロセスごとに処理
  doc.querySelectorAll('process').forEach(process => {

    // このプロセス内の全ノードIDを収集
    const nodeIds = new Set();
    const tags = [
      'startEvent','endEvent','task','userTask','exclusiveGateway',
      'parallelGateway','serviceTask','scriptTask','manualTask',
      'sendTask','receiveTask','intermediateThrowEvent',
      'intermediateCatchEvent','subProcess'
    ];
    tags.forEach(tag => {
      process.querySelectorAll(tag).forEach(e => {
        nodeIds.add(e.getAttribute('id'));
      });
    });

    // このプロセス内のSequenceFlowのみ抽出
    const processFlows = [];
    doc.querySelectorAll('sequenceFlow').forEach(flow => {
      const src = flow.getAttribute('sourceRef');
      const tgt = flow.getAttribute('targetRef');
      if (nodeIds.has(src) && nodeIds.has(tgt)) {
        processFlows.push({ id: flow.getAttribute('id'), sourceRef: src, targetRef: tgt });
      }
    });

    // ③ トポロジカルソート（Kahnのアルゴリズム）
    const inDegree  = new Map();
    const outEdges  = new Map();
    nodeIds.forEach(id => { inDegree.set(id, 0); outEdges.set(id, []); });
    processFlows.forEach(f => {
      inDegree.set(f.targetRef, (inDegree.get(f.targetRef) || 0) + 1);
      outEdges.get(f.sourceRef).push(f.targetRef);
    });

    const queue = [];
    inDegree.forEach((deg, id) => { if (deg === 0) queue.push(id); });

    const topoOrder = [];
    const visited = new Set();
    while (queue.length > 0) {
      const node = queue.shift();
      if (visited.has(node)) continue;
      visited.add(node);
      topoOrder.push(node);
      (outEdges.get(node) || []).forEach(next => {
        const newDeg = (inDegree.get(next) || 1) - 1;
        inDegree.set(next, newDeg);
        if (newDeg <= 0 && !visited.has(next)) queue.push(next);
      });
    }
    // 未訪問ノード（ループ内）も末尾に追加
    nodeIds.forEach(id => { if (!visited.has(id)) topoOrder.push(id); });

    // ④ ★ Lane別にノードを分類してX座標を振り直す
    const laneNodes = new Map(); // laneId → [nodeId, ...]（トポロジカル順）
    const noLaneNodes = [];

    process.querySelectorAll('lane').forEach(lane => {
      const laneId = lane.getAttribute('id');
      const refs = [...lane.querySelectorAll('flowNodeRef')]
        .map(r => r.textContent.trim());
      // トポロジカル順を維持しながらLane内ノードを並べる
      const ordered = topoOrder.filter(id => refs.includes(id));
      // トポロジカル順に含まれなかったノードも末尾に追加
      refs.forEach(id => { if (!ordered.includes(id)) ordered.push(id); });
      laneNodes.set(laneId, ordered);
    });

    // Lane内ノードのX座標を振り直す
    laneNodes.forEach((nodeList, laneId) => {
      const laneShape = doc.querySelector(`BPMNShape[bpmnElement="${laneId}"]`);
      if (!laneShape) return;
      const lb = laneShape.querySelector('Bounds');
      const laneX = parseFloat(lb.getAttribute('x'));
      const laneY = parseFloat(lb.getAttribute('y'));
      const laneH = parseFloat(lb.getAttribute('height'));

      let currentX = laneX + START_X;

      nodeList.forEach(nodeId => {
        const b = getBounds(nodeId);
        if (!b) return;

        const nodeY = laneY + (laneH - b.h) / 2; // Lane内垂直中央
        setBounds(nodeId, currentX, nodeY);
        currentX += b.w + MARGIN;
      });
    });

    // ⑤ Lane外ノード（外部プロセス等）はSequenceFlowを辿ってX補正
    // トポロジカル順にsource右端+MARGIN > target左端 なら右にずらす
    topoOrder.forEach(nodeId => {
      if ([...laneNodes.values()].some(list => list.includes(nodeId))) return;
      // Lane外ノードはそのまま（外部プロセスは別途処理）
    });
  });

  // ⑥ Participant・Lane幅を最大X座標に合わせて拡張
  doc.querySelectorAll('[processRef]').forEach(participant => {
    const participantId = participant.getAttribute('id');
    const processRef    = participant.getAttribute('processRef');
    const process       = doc.querySelector(`[id="${processRef}"]`);
    if (!process) return;

    const pShape = doc.querySelector(`BPMNShape[bpmnElement="${participantId}"]`);
    if (!pShape) return;
    const pBounds = pShape.querySelector('Bounds');

    let maxRight = 0;
    const tags = [
      'startEvent','endEvent','task','userTask','exclusiveGateway',
      'parallelGateway','serviceTask','scriptTask','manualTask',
      'sendTask','receiveTask'
    ];
    tags.forEach(tag => {
      process.querySelectorAll(tag).forEach(e => {
        const b = getBounds(e.getAttribute('id'));
        if (b) maxRight = Math.max(maxRight, b.x + b.w);
      });
    });

    if (maxRight === 0) return;
    const newWidth = maxRight + 80;
    pBounds.setAttribute('width', newWidth);

    process.querySelectorAll('lane').forEach(lane => {
      const laneShape = doc.querySelector(
        `BPMNShape[bpmnElement="${lane.getAttribute('id')}"]`
      );
      if (!laneShape) return;
      laneShape.querySelector('Bounds').setAttribute('width', newWidth - LANE_LABEL_WIDTH);
    });
  });

  // ⑦ 全Edgeのwaypoint再計算
  const shapeBounds = collectShapeBounds(doc);

  doc.querySelectorAll('BPMNEdge').forEach(edge => {
    const eid = edge.getAttribute('bpmnElement');

    const seqFlow = doc.querySelector(`sequenceFlow[id="${eid}"]`);
    if (seqFlow) {
      const src = shapeBounds.get(seqFlow.getAttribute('sourceRef'));
      const tgt = shapeBounds.get(seqFlow.getAttribute('targetRef'));
      if (src && tgt) {
        [...edge.querySelectorAll('waypoint')].forEach(wp => wp.remove());

        // ★ 同一Lane内なら直線、異なるLane間ならL字
        const srcLane = getLaneOfNode(doc, seqFlow.getAttribute('sourceRef'));
        const tgtLane = getLaneOfNode(doc, seqFlow.getAttribute('targetRef'));
        const isSameLane = srcLane && tgtLane &&
          srcLane.getAttribute('id') === tgtLane.getAttribute('id');

        const points = isSameLane
          ? calcStraightWaypoints(src, tgt)   // 直線
          : calcLWaypoints(src, tgt);          // L字

        points.forEach(p => {
          const wp = doc.createElementNS(diNs, 'di:waypoint');
          wp.setAttribute('x', p.x);
          wp.setAttribute('y', p.y);
          edge.appendChild(wp);
        });
      }
      return;
    }

    const msgFlow = doc.querySelector(`messageFlow[id="${eid}"]`);
    if (msgFlow) {
      const src = shapeBounds.get(msgFlow.getAttribute('sourceRef'));
      const tgt = shapeBounds.get(msgFlow.getAttribute('targetRef'));
      if (src && tgt) {
        [...edge.querySelectorAll('waypoint')].forEach(wp => wp.remove());
        calcMessageFlowWaypoints(src, tgt).forEach(p => {
          const wp = doc.createElementNS(diNs, 'di:waypoint');
          wp.setAttribute('x', p.x);
          wp.setAttribute('y', p.y);
          edge.appendChild(wp);
        });
      }
    }
  });

  return serializer.serializeToString(doc);
}

const MARGIN = 40;
  
// ============================================
// 直線waypoint（同一Lane内・左→右）
// ============================================
function calcStraightWaypoints(source, target) {
  const sx = source.x + source.w;      // ソース右端
  const sy = source.y + source.h / 2;  // ソース中央Y
  const tx = target.x;                 // ターゲット左端
  const ty = target.y + target.h / 2;  // ターゲット中央Y

  // ★ ソースがターゲットより右にある場合（逆向き）は
  //    ソース左端 → ターゲット右端 で接続
  if (sx > tx + target.w) {
    return [
      { x: source.x,          y: sy },
      { x: target.x + target.w, y: ty },
    ];
  }

  // 通常（左→右）
  return [
    { x: sx, y: sy },
    { x: tx, y: ty },
  ];
}

// ============================================
// L字waypoint（異なるLane間）
// ============================================
function calcLWaypoints(source, target) {
  const sx = source.x + source.w;      // ソース右端
  const sy = source.y + source.h / 2;  // ソース中央Y
  const tx = target.x;                 // ターゲット左端
  const ty = target.y + target.h / 2;  // ターゲット中央Y

  // ★ Y座標が同じなら直線
  if (Math.abs(sy - ty) < 5) {
    return [{ x: sx, y: sy }, { x: tx, y: ty }];
  }

  // ★ ソースがターゲットより右にある場合（逆向き・折り返し）
  if (sx > tx) {
    // ソース左端から出てターゲット右端へ
    const exitX = Math.min(source.x, target.x + target.w) - MARGIN;
    return [
      { x: source.x, y: sy },
      { x: exitX,    y: sy },
      { x: exitX,    y: ty },
      { x: target.x + target.w, y: ty },
    ];
  }

  // 通常（左→右・L字）
  const midX = Math.round((sx + tx) / 2);
  return [
    { x: sx,   y: sy },
    { x: midX, y: sy },
    { x: midX, y: ty },
    { x: tx,   y: ty },
  ];
}

// ============================================
// L字waypoint計算（MessageFlow用・縦方向）
// ============================================
function calcMessageFlowWaypoints(source, target) {
  const sx = source.x + source.w / 2;
  const tx = target.x + target.w / 2;
  let sy, ty;
  if (source.y < target.y) {
    sy = source.y + source.h;
    ty = target.y;
  } else {
    sy = source.y;
    ty = target.y + target.h;
  }
  if (Math.abs(sx - tx) < 5) {
    return [{ x: sx, y: sy }, { x: tx, y: ty }];
  }
  const midY = Math.round((sy + ty) / 2);
  return [
    { x: sx, y: sy   },
    { x: sx, y: midY },
    { x: tx, y: midY },
    { x: tx, y: ty   },
  ];
}

// ============================================
// ⑧ 名前空間プレフィックス正規化
//    XMLSerializer が ns0: / ns1: 等に置換する問題を修正
// ============================================
function normalizePrefixes(xml) {
  const nsMap = {
    'http://www.omg.org/spec/BPMN/20100524/MODEL': 'bpmn2',
    'http://www.omg.org/spec/BPMN/20100524/DI':    'bpmndi',
    'http://www.omg.org/spec/DD/20100524/DC':       'dc',
    'http://www.omg.org/spec/DD/20100524/DI':       'di',
  };

  const declPattern = /xmlns:([a-zA-Z0-9_]+)="([^"]+)"/g;
  let m;
  const prefixRemap = {};
  while ((m = declPattern.exec(xml)) !== null) {
    const [, prefix, uri] = m;
    const canonical = nsMap[uri];
    if (canonical && prefix !== canonical) {
      prefixRemap[prefix] = canonical;
    }
  }

  if (Object.keys(prefixRemap).length === 0) return xml;

  let result = xml;
  for (const [oldPfx, newPfx] of Object.entries(prefixRemap)) {
    const tagPattern = new RegExp(`(</?|\\s)${oldPfx}:`, 'g');
    result = result.replace(tagPattern, `$1${newPfx}:`);
    const nsDecl = new RegExp(`xmlns:${oldPfx}=`, 'g');
    result = result.replace(nsDecl, `xmlns:${newPfx}=`);
  }
  return result;
}

// ============================================
// フォールバック用: DI情報なしXMLに最低限のDIを付与
// ============================================
function buildMinimalDi(xml) {
  const parser = new DOMParser();
  const serializer = new XMLSerializer();
  const doc = parser.parseFromString(xml, 'application/xml');

  if (doc.querySelector('BPMNDiagram')) return xml;

  const bpmndiNs = 'http://www.omg.org/spec/BPMN/20100524/DI';
  const dcNs     = 'http://www.omg.org/spec/DD/20100524/DC';
  const diNs     = 'http://www.omg.org/spec/DD/20100524/DI';

  const definitions = doc.documentElement;
  const collaboration = doc.querySelector('collaboration');
  const planeElement  = collaboration || doc.querySelector('process');
  if (!planeElement) return xml;

  const diagram = doc.createElementNS(bpmndiNs, 'bpmndi:BPMNDiagram');
  diagram.setAttribute('id', 'BPMNDiagram_1');
  const plane = doc.createElementNS(bpmndiNs, 'bpmndi:BPMNPlane');
  plane.setAttribute('id', 'BPMNPlane_1');
  plane.setAttribute('bpmnElement', planeElement.getAttribute('id'));
  diagram.appendChild(plane);

  const TAGS = ['startEvent','endEvent','task','userTask','serviceTask',
    'scriptTask','manualTask','sendTask','receiveTask',
    'exclusiveGateway','parallelGateway','inclusiveGateway',
    'intermediateThrowEvent','intermediateCatchEvent','subProcess'];
  let xPos = 100;
  const NODE_GAP = 150;

  TAGS.forEach(tag => {
    doc.querySelectorAll(tag).forEach(node => {
      const id = node.getAttribute('id');
      if (!id) return;
      const shape = doc.createElementNS(bpmndiNs, 'bpmndi:BPMNShape');
      shape.setAttribute('id', id + '_di');
      shape.setAttribute('bpmnElement', id);
      const bounds = doc.createElementNS(dcNs, 'dc:Bounds');
      const isEvent   = tag.includes('Event');
      const isGateway = tag.includes('Gateway');
      const w = isEvent ? 36 : isGateway ? 50 : 100;
      const h = isEvent ? 36 : isGateway ? 50 : 80;
      bounds.setAttribute('x', xPos);
      bounds.setAttribute('y', 200);
      bounds.setAttribute('width', w);
      bounds.setAttribute('height', h);
      shape.appendChild(bounds);
      plane.appendChild(shape);
      xPos += NODE_GAP;
    });
  });

  doc.querySelectorAll('sequenceFlow').forEach(flow => {
    const id  = flow.getAttribute('id');
    const edge = doc.createElementNS(bpmndiNs, 'bpmndi:BPMNEdge');
    edge.setAttribute('id', id + '_di');
    edge.setAttribute('bpmnElement', id);
    const wp1 = doc.createElementNS(diNs, 'di:waypoint');
    wp1.setAttribute('x', 100); wp1.setAttribute('y', 218);
    const wp2 = doc.createElementNS(diNs, 'di:waypoint');
    wp2.setAttribute('x', 250); wp2.setAttribute('y', 218);
    edge.appendChild(wp1);
    edge.appendChild(wp2);
    plane.appendChild(edge);
  });

  definitions.appendChild(diagram);
  return serializer.serializeToString(doc);
}

// ============================================
// ③ ノードが属するLane要素を返す
// ============================================
function getLaneOfNode(doc, nodeId) {
  const lanes = doc.querySelectorAll('lane');
  for (const lane of lanes) {
    const refs = [...lane.querySelectorAll('flowNodeRef')]
      .map(r => r.textContent.trim());
    if (refs.includes(nodeId)) return lane;
  }
  return null;
}

// ============================================
// shapeBounds収集（共通）
// ============================================
function collectShapeBounds(doc) {
  const map = new Map();
  doc.querySelectorAll('BPMNShape').forEach(shape => {
    const id = shape.getAttribute('bpmnElement');
    const bounds = shape.querySelector('Bounds');
    if (!id || !bounds) return;
    map.set(id, {
      x: parseFloat(bounds.getAttribute('x')),
      y: parseFloat(bounds.getAttribute('y')),
      w: parseFloat(bounds.getAttribute('width')),
      h: parseFloat(bounds.getAttribute('height')),
    });
  });
  return map;
}

// ============================================
// ① SequenceFlowのBPMNEdgeを追加
// ============================================
function addSequenceFlowEdges(xml) {
  const parser = new DOMParser();
  const serializer = new XMLSerializer();
  const doc = parser.parseFromString(xml, 'application/xml');

  const shapeBounds = collectShapeBounds(doc);

  const existingEdges = new Set();
  doc.querySelectorAll('BPMNEdge').forEach(edge => {
    existingEdges.add(edge.getAttribute('bpmnElement'));
  });

  const plane = doc.querySelector('BPMNPlane');
  const diNs   = 'http://www.omg.org/spec/DD/20100524/DI';
  const bpmndiNs = 'http://www.omg.org/spec/BPMN/20100524/DI';

  doc.querySelectorAll('sequenceFlow').forEach(flow => {
    const id = flow.getAttribute('id');
    if (existingEdges.has(id)) return;

    const source = shapeBounds.get(flow.getAttribute('sourceRef'));
    const target = shapeBounds.get(flow.getAttribute('targetRef'));
    if (!source || !target) return;

    const edge = doc.createElementNS(bpmndiNs, 'bpmndi:BPMNEdge');
    edge.setAttribute('id', id + '_di');
    edge.setAttribute('bpmnElement', id);

    calcLWaypoints(source, target).forEach(p => {
      const wp = doc.createElementNS(diNs, 'di:waypoint');
      wp.setAttribute('x', p.x);
      wp.setAttribute('y', p.y);
      edge.appendChild(wp);
    });

    plane.appendChild(edge);
  });

  return serializer.serializeToString(doc);
}

// ============================================
// ② LaneをY方向に並べ直す＋waypoint再計算
// ============================================
function fixLaneLayout(xml) {
  const parser = new DOMParser();
  const serializer = new XMLSerializer();
  const doc = parser.parseFromString(xml, 'application/xml');
  const diNs = 'http://www.omg.org/spec/DD/20100524/DI';

  // --- Lane並べ直し ---
  doc.querySelectorAll('[processRef]').forEach(participant => {
    const participantId = participant.getAttribute('id');
    const processRef    = participant.getAttribute('processRef');
    const process       = doc.querySelector(`[id="${processRef}"]`);
    if (!process) return;

    const participantShape = doc.querySelector(
      `BPMNShape[bpmnElement="${participantId}"]`
    );
    if (!participantShape) return;

    const pBounds = participantShape.querySelector('Bounds');
    const pX = parseFloat(pBounds.getAttribute('x'));
    const pY = parseFloat(pBounds.getAttribute('y'));
    const pH = parseFloat(pBounds.getAttribute('height'));
    const pW = parseFloat(pBounds.getAttribute('width'));

    const lanes = [...process.querySelectorAll('lane')];
    if (lanes.length === 0) return;

    const laneShapes = lanes.map(lane => {
      const laneId = lane.getAttribute('id');
      const shape  = doc.querySelector(`BPMNShape[bpmnElement="${laneId}"]`);
      if (!shape) return null;
      const bounds = shape.querySelector('Bounds');
      return {
        laneId, lane, shape, bounds,
        x: parseFloat(bounds.getAttribute('x')),
        y: parseFloat(bounds.getAttribute('y')),
        w: parseFloat(bounds.getAttribute('width')),
        h: parseFloat(bounds.getAttribute('height')),
      };
    }).filter(Boolean);

    if (laneShapes.length === 0) return;

    const xSet = new Set(laneShapes.map(l => l.x));
    const ySet = new Set(laneShapes.map(l => l.y));
    const isHorizontallyArranged = xSet.size > 1 && ySet.size === 1;
    if (!isHorizontallyArranged) return;

    laneShapes.sort((a, b) => a.x - b.x);

    const labelWidth = 30;
    const laneHeight = Math.floor(pH / laneShapes.length);

    laneShapes.forEach((laneInfo, index) => {
      const oldLaneX = laneInfo.x;
      const newLaneY = pY + index * laneHeight;
      const newLaneH = index === laneShapes.length - 1
        ? pH - index * laneHeight
        : laneHeight;

      laneInfo.bounds.setAttribute('x', pX + labelWidth);
      laneInfo.bounds.setAttribute('y', newLaneY);
      laneInfo.bounds.setAttribute('width',  pW - labelWidth);
      laneInfo.bounds.setAttribute('height', newLaneH);

      [...laneInfo.lane.querySelectorAll('flowNodeRef')]
        .map(ref => ref.textContent.trim())
        .forEach(nodeId => {
          const nodeShape = doc.querySelector(
            `BPMNShape[bpmnElement="${nodeId}"]`
          );
          if (!nodeShape) return;
          const nb = nodeShape.querySelector('Bounds');
          if (!nb) return;

          const nodeX = parseFloat(nb.getAttribute('x'));
          const nodeH = parseFloat(nb.getAttribute('height'));
          const relX  = nodeX - oldLaneX;

          nb.setAttribute('x', pX + labelWidth + relX);
          nb.setAttribute('y', newLaneY + (newLaneH - nodeH) / 2);
        });
    });
  });

  // --- Lane移動後にshapeBoundsを再収集 ---
  const shapeBounds = collectShapeBounds(doc);  // ★ doc を引数で渡す

  // --- SequenceFlowのwaypoint再計算（L字）---
  doc.querySelectorAll('BPMNEdge').forEach(edge => {
    const bpmnElementId = edge.getAttribute('bpmnElement');
    const flow = doc.querySelector(`sequenceFlow[id="${bpmnElementId}"]`);
    if (!flow) return;

    const source = shapeBounds.get(flow.getAttribute('sourceRef'));
    const target = shapeBounds.get(flow.getAttribute('targetRef'));
    if (!source || !target) return;

    [...edge.querySelectorAll('waypoint')].forEach(wp => wp.remove());

    calcLWaypoints(source, target).forEach(p => {
      const wp = doc.createElementNS(diNs, 'di:waypoint');
      wp.setAttribute('x', p.x);
      wp.setAttribute('y', p.y);
      edge.appendChild(wp);
    });
  });

  return serializer.serializeToString(doc);
}
