<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#0d0f14;--surface:#161921;--surface2:#1e2230;--border:#2a2f3d;
    --accent:#4f9cf9;--accent2:#7c5cfc;--success:#3ecf8e;--warn:#f97316;
    --text:#e2e8f0;--text-muted:#64748b;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);
       height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;
         align-items:center;gap:10px;background:var(--surface);flex-shrink:0;}
  .logo{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));
        border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;}
  header h1{font-size:14px;font-weight:500;}
  header .sub{font-size:11px;color:var(--text-muted);}
  .badge{margin-left:auto;font-size:10px;padding:2px 8px;
         background:rgba(79,156,249,.12);color:var(--accent);
         border:1px solid rgba(79,156,249,.25);border-radius:20px;
         font-family:'JetBrains Mono',monospace;}
  .main{display:flex;flex:1;overflow:hidden;}
  /* left panel */
  .panel-left{width:300px;flex-shrink:0;display:flex;flex-direction:column;
              border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;}
  .panel-section{padding:14px;border-bottom:1px solid var(--border);}
  .label{font-size:10px;font-weight:500;color:var(--text-muted);
         text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--border);
           border-radius:var(--radius);color:var(--text);
           font-family:'Noto Sans JP',sans-serif;font-size:12px;
           line-height:1.7;padding:10px;resize:none;outline:none;transition:border-color .2s;}
  textarea:focus{border-color:var(--accent);}
  textarea::placeholder{color:var(--text-muted);}
  .examples{display:flex;flex-direction:column;gap:5px;margin-top:7px;}
  .example-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
               color:var(--text-muted);font-size:11px;font-family:'Noto Sans JP',sans-serif;
               padding:6px 10px;text-align:left;cursor:pointer;transition:all .15s;}
  .example-btn:hover{border-color:var(--accent);color:var(--text);}
  .btn-primary{width:100%;padding:11px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;border-radius:var(--radius);color:#fff;
    font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:500;
    cursor:pointer;transition:opacity .2s,transform .1s;}
  .btn-primary:hover{opacity:.9;}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .error-bar{display:none;margin-top:8px;padding:8px 12px;
    background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
    border-radius:8px;font-size:11px;color:#f87171;}
  .xml-panel{flex:1;overflow-y:auto;padding:14px;min-height:80px;}
  .xml-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .copy-btn{font-size:10px;padding:3px 8px;background:var(--surface2);
    border:1px solid var(--border);border-radius:4px;color:var(--text-muted);
    cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s;}
  .copy-btn:hover{border-color:var(--accent);color:var(--accent);}
  pre#xml-output{background:var(--surface2);border:1px solid var(--border);
    border-radius:var(--radius);padding:10px;font-family:'JetBrains Mono',monospace;
    font-size:10px;line-height:1.6;color:#a5b4cc;white-space:pre-wrap;
    word-break:break-all;min-height:60px;}
  /* right panel */
  .panel-right{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
  .viewer-header{padding:9px 14px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px;background:var(--surface);flex-shrink:0;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);transition:background .3s;}
  .status-dot.active {background:var(--success);box-shadow:0 0 5px var(--success);}
  .status-dot.loading{background:var(--warn);animation:pulse 1s infinite;}
  .status-dot.edit   {background:var(--accent);box-shadow:0 0 5px var(--accent);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .viewer-title{font-size:12px;color:var(--text-muted);}
  .toolbar-right{margin-left:auto;display:flex;gap:6px;}
  .tool-btn{font-size:10px;padding:3px 10px;background:var(--surface2);
    border:1px solid var(--border);border-radius:4px;color:var(--text-muted);
    cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .15s;white-space:nowrap;}
  .tool-btn:hover {border-color:var(--accent);color:var(--accent);}
  .tool-btn.active{background:rgba(79,156,249,.15);border-color:var(--accent);color:var(--accent);}
  #bpmn-container{flex:1;position:relative;overflow:hidden;background:#fff;}
  .empty-state{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;
    color:var(--text-muted);pointer-events:none;}
  .empty-state .icon{font-size:40px;opacity:.25;}
  .empty-state p{font-size:12px;}
  #bpmn-container .bjs-container{background:#fff!important;}
  #bpmn-container .djs-container svg{background:#fff!important;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>

2. 申請者が申請書・添付書類（施設の図面・食品衛生責任者資格証明等）を提出する
3. 受付担当者が書類の記載内容・添付書類の過不足を確認する
4. 不備がある場合は申請者に補正を依頼する
5. 書類審査が完了したら現地調査（施設検査）の日程を調整する

// ================================================================
// bpmn-js インスタンス管理
// ================================================================
let viewer  = null;
let modeler = null;
let currentMode = 'edit';
let lastXml = '';

function initViewer() {
  if (viewer) return;
  viewer = new BpmnJS({ container: '#bpmn-container' });
}

function initModeler() {
  if (modeler) return;
  modeler = new BpmnModeler({ container: '#bpmn-container' });
  modeler.on('commandStack.changed', async () => {
    try {
      const { xml } = await modeler.saveXML({ format: true });
      lastXml = xml;
      document.getElementById('xml-output').textContent = xml;
    } catch(e) {}
  });
}

async function displayXml(xml, mode) {
  document.getElementById('empty-state').style.display = 'none';
  lastXml = xml;
  document.getElementById('xml-output').textContent = xml;
  if (mode === 'edit') {
    if (viewer)  { try { viewer.destroy();  } catch(e){} viewer  = null; }
    initModeler();
    await modeler.importXML(xml);
  } else {
    if (modeler) { try { modeler.destroy(); } catch(e){} modeler = null; }
    initViewer();
    await viewer.importXML(xml);
  }
  fitView();
}

window.switchMode = async function(mode) {
  if (currentMode === mode) return;

  // 切替前に現在のXMLを保存
  if (currentMode === 'edit' && modeler) {
    try { const { xml } = await modeler.saveXML({ format: true }); lastXml = xml; } catch(e){}
  }
  currentMode = mode;
  document.getElementById('btn-view-mode').classList.toggle('active', mode === 'view');
  document.getElementById('btn-edit-mode').classList.toggle('active', mode === 'edit');
  if (!lastXml) return;
  setStatus('loading', mode === 'edit' ? '編集モードに切り替え中…' : '閲覧モードに切り替え中…');
  try {
    await displayXml(lastXml, mode);
    setStatus(mode === 'edit' ? 'edit' : 'active', mode === 'edit' ? '編集モード' : '閲覧モード');
  } catch(e) {
    setStatus('', 'モード切替エラー: ' + e.message);
  }
};

window.fitView = function() {
  try {
    if (modeler) modeler.get('canvas').zoom('fit-viewport', 'auto');
    else if (viewer) viewer.get('canvas').zoom('fit-viewport', 'auto');
  } catch(e) {}
};

window.relayout = async function() {
  if (!lastXml) return;
  setStatus('loading', '再レイアウト中…');
  try {
    let xml = lastXml;
    if (currentMode === 'edit' && modeler) {
      try { const r = await modeler.saveXML({ format: true }); xml = r.xml; } catch(e){}
    }
    const laid = applyLayout(xml);
    await displayXml(laid, currentMode);
    setStatus(currentMode === 'edit' ? 'edit' : 'active', '再レイアウト完了');
  } catch(e) {
    setStatus('', '再レイアウトエラー: ' + e.message);
    console.error(e);
  }
};

// ================================================================
// Dify API
// ================================================================
const DIFY_API_KEY = 'app-Zk8VZaLzzi3XQELdSa7sA1ft';
const DIFY_API_URL = 'https://api.dify.ai/v1/workflows/run';

async function fetchWithRetry(prompt, retryCount = 0) {
  const MAX_RETRIES = 4, BASE_DELAY = 2000;
  const response = await fetch(DIFY_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DIFY_API_KEY },
    body: JSON.stringify({ inputs: { business_flow: prompt }, response_mode: 'streaming', user: 'bpmn-user' }),
  });
  if ((response.status === 529 || response.status === 504) && retryCount < MAX_RETRIES) {
    const delay = BASE_DELAY * Math.pow(2, retryCount);
    document.getElementById('viewer-title').textContent = 'サーバー混雑 … ' + (retryCount+1) + '回目リトライ（' + delay/1000 + '秒後）';
    await new Promise(r => setTimeout(r, delay));
    return fetchWithRetry(prompt, retryCount + 1);
  }
  if (!response.ok) { const b = await response.text().catch(()=>''); throw new Error('API Error: ' + response.status + ' ' + b); }
  return response;
}

async function readStreamXml(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', xml = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const js = line.slice(6).trim();
      if (!js || js === '[DONE]') continue;
      try {
        const ev = JSON.parse(js);
        if (ev.event === 'node_finished' && ev.data?.title)
          document.getElementById('viewer-title').textContent = ev.data.title + ' 完了…';
        if (ev.event === 'workflow_finished') {
          const out = ev.data?.outputs;
          if (out) xml = out.text || out.xml || out.result
            || Object.values(out).find(v => typeof v === 'string' && v.includes('bpmn2:')) || '';
        }
      } catch(e) {}
    }
  }
  return xml;
}

window.generate = async function() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  const btn = document.getElementById('gen-btn');
  const errorBar = document.getElementById('error-bar');
  btn.disabled = true; btn.textContent = '⏳ 生成中…';
  errorBar.style.display = 'none';
  setStatus('loading', 'BPMN XML を生成中…');
  try {
    const response = await fetchWithRetry(prompt);
    let xml = await readStreamXml(response);
    if (!xml) throw new Error('XMLが取得できませんでした。Difyの出力変数を確認してください。');
    xml = xml.replace(/^```xml\n?/, '').replace(/^```\n?/, '').replace(/\n?```$/, '').trim();
    setStatus('loading', 'レイアウト計算中…');
    const laid = applyLayout(xml);
    setStatus('loading', 'レンダリング中…');
    await displayXml(laid, currentMode);
    setStatus(currentMode === 'edit' ? 'edit' : 'active', '生成完了 ✓');
  } catch(err) {
    setStatus('', 'エラーが発生しました');
    errorBar.style.display = 'block';
    errorBar.textContent = err.message;
    console.error(err);
  } finally {
    btn.disabled = false; btn.textContent = '⚡ BPMN を生成する';
  }
};

window.copyXml = function(e) {
  const xml = document.getElementById('xml-output').textContent;
  navigator.clipboard.writeText(xml).then(() => {
    e.target.textContent = 'コピー済 ✓';
    setTimeout(() => e.target.textContent = 'コピー', 1500);
  });
};

function setStatus(cls, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot' + (cls ? ' ' + cls : '');
  document.getElementById('viewer-title').textContent = text;
}

window.addEventListener('load', () => {
  initModeler();
  document.getElementById('btn-edit-mode').classList.add('active');
  document.getElementById('prompt').addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') window.generate();
  });
});

// ================================================================
//  BPMN レイアウトエンジン（全10フェーズ）
//  アルゴリズム仕様:
//  F0: 前処理（ノード・フロー収集）
//  F1: BFS + Back-edge軽減 → level
//  F2: messageFlow制約（後ろに押すだけ）
//  F3: sequenceFlow再伝播（収束保証）
//  F4: X座標 = level * X_SPACING
//  F5: Y座標（重み付き親平均）
//  F6: Lane内衝突回避
//  F7: レーン間整列（同levelのY平均揃え）
//  F8: 再衝突回避
//  F9: sequenceFlow描画（waypoint）
//  F10: messageFlow描画（Pool境界 + Manhattan）
// ================================================================

// --- レイアウト定数 ---
const TASK_W=100,TASK_H=80,GW_W=50,GW_H=50,EV_W=36,EV_H=36;
const X_SPACING=160, Y_SPACING=100;
const LANE_PAD_X=60, LANE_PAD_Y=28, LANE_MIN_H=140;
const LANE_LABEL_W=30, PART_LABEL_W=30;
const PART_V_GAP=20, NODE_MARGIN=12;
const MSG_OFFSET=12;

function nodeSize(tag) {
  if (!tag) return {w:TASK_W,h:TASK_H};
  const t = tag.replace(/^.*:/,'').toLowerCase();
  if (t.includes('event'))   return {w:EV_W,  h:EV_H  };
  if (t.includes('gateway')) return {w:GW_W,  h:GW_H  };
  return {w:TASK_W,h:TASK_H};
}
function lname(el) { return (el.localName||el.tagName||'').replace(/^.*:/,''); }

const FLOW_TAGS=['startEvent','endEvent','task','userTask','serviceTask','scriptTask',
  'manualTask','sendTask','receiveTask','exclusiveGateway','parallelGateway',
  'inclusiveGateway','eventBasedGateway','intermediateThrowEvent',
  'intermediateCatchEvent','boundaryEvent','subProcess','callActivity'];

// ================================================================
// メインエントリ
// ================================================================
function applyLayout(xmlStr) {
  const parser=new DOMParser(), serializer=new XMLSerializer();
  const doc=parser.parseFromString(xmlStr,'application/xml');

  // 既存DIを削除
  [...doc.querySelectorAll('BPMNDiagram')].forEach(d=>d.remove());

  const NS_DI='http://www.omg.org/spec/BPMN/20100524/DI';
  const NS_DC='http://www.omg.org/spec/DD/20100524/DC';
  const NS_DD='http://www.omg.org/spec/DD/20100524/DI';
  const defs=doc.documentElement;
  const collab=doc.querySelector('collaboration');

  // BPMNDiagram/BPMNPlane 生成
  const diagram=doc.createElementNS(NS_DI,'bpmndi:BPMNDiagram');
  diagram.setAttribute('id','BPMNDiagram_1');
  const plane=doc.createElementNS(NS_DI,'bpmndi:BPMNPlane');
  plane.setAttribute('id','BPMNPlane_1');
  plane.setAttribute('bpmnElement', collab ? collab.getAttribute('id')
    : (doc.querySelector('process')?.getAttribute('id')||'Definitions_1'));
  diagram.appendChild(plane); defs.appendChild(diagram);

  // Shape/Edge生成ヘルパー
  const nodeBounds=new Map();
  function mkShape(id,x,y,w,h,attrs={}) {
    const s=doc.createElementNS(NS_DI,'bpmndi:BPMNShape');
    s.setAttribute('id',id+'_di'); s.setAttribute('bpmnElement',id);
    for(const[k,v]of Object.entries(attrs)) s.setAttribute(k,String(v));
    const b=doc.createElementNS(NS_DC,'dc:Bounds');
    b.setAttribute('x',Math.round(x)); b.setAttribute('y',Math.round(y));
    b.setAttribute('width',Math.round(w)); b.setAttribute('height',Math.round(h));
    s.appendChild(b); plane.appendChild(s);
    nodeBounds.set(id,{x,y,w,h});
  }
  function mkEdge(id,wps,attrs={}) {
    const e=doc.createElementNS(NS_DI,'bpmndi:BPMNEdge');
    e.setAttribute('id',id+'_di'); e.setAttribute('bpmnElement',id);
    for(const[k,v]of Object.entries(attrs)) e.setAttribute(k,String(v));
    wps.forEach(([x,y])=>{
      const wp=doc.createElementNS(NS_DD,'di:waypoint');
      wp.setAttribute('x',Math.round(x)); wp.setAttribute('y',Math.round(y));
      e.appendChild(wp);
    });
    plane.appendChild(e);
  }

  // ================================================================
  // F0: 前処理
  // ================================================================
  function collectProcess(proc) {
    const nodes=[];
    FLOW_TAGS.forEach(tag=>proc.querySelectorAll(tag).forEach(el=>{
      const id=el.getAttribute('id'); if(id) nodes.push({id,tag:lname(el),el});
    }));
    const nids=new Set(nodes.map(n=>n.id));
    const seqs=[];
    doc.querySelectorAll('sequenceFlow').forEach(f=>{
      const s=f.getAttribute('sourceRef'),t=f.getAttribute('targetRef');
      if(nids.has(s)&&nids.has(t)) seqs.push({id:f.getAttribute('id'),src:s,tgt:t});
    });
    const outMap=new Map(nodes.map(n=>[n.id,[]]));
    const inMap =new Map(nodes.map(n=>[n.id,[]]));
    seqs.forEach(f=>{ outMap.get(f.src)?.push(f.tgt); inMap.get(f.tgt)?.push(f.src); });

    const lanes=[];
    proc.querySelectorAll('lane').forEach(lane=>{
      lanes.push({
        id:lane.getAttribute('id'),
        name:lane.getAttribute('name')||'',
        nodeIds:new Set([...lane.querySelectorAll('flowNodeRef')].map(r=>r.textContent.trim())),
      });
    });
    if(lanes.length===0) lanes.push({id:null,name:null,nodeIds:nids});
    return {nodes,nids,seqs,outMap,inMap,lanes};
  }

  // ================================================================
  // F1: BFS + Back-edge軽減
  // ================================================================
  function bfsLevels(nodes,seqs,outMap,inMap) {
    const level=new Map(nodes.map(n=>[n.id,0]));
    // startノード: incomingなし → 優先的にstartEvent
    const starts=nodes.filter(n=>(inMap.get(n.id)||[]).length===0)
      .sort((a,b)=>(b.tag.includes('start')?1:0)-(a.tag.includes('start')?1:0))
      .map(n=>n.id);
    if(starts.length===0 && nodes.length>0) starts.push(nodes[0].id);
    starts.forEach(id=>level.set(id,1));
    const queue=[...starts], visited=new Set();
    while(queue.length>0) {
      const cur=queue.shift();
      if(visited.has(cur)) continue;
      visited.add(cur);
      const lv=level.get(cur)||0;
      for(const nxt of(outMap.get(cur)||[])) {
        if(visited.has(nxt)&&(level.get(nxt)||0)<=lv) continue;
        const nl=lv+1;
        if(nl>(level.get(nxt)||0)) { level.set(nxt,nl); queue.push(nxt); }
      }
    }
    nodes.forEach(n=>{ if(!level.get(n.id)) level.set(n.id,1); });
    return level;
  }

  // ================================================================
  // F2: messageFlow制約（後ろに押すだけ）
  // ================================================================
  function applyMsgConstraints(level,msgFlows,nodeInProcess) {
    msgFlows.forEach(mf=>{
      const src=mf.getAttribute('sourceRef'), tgt=mf.getAttribute('targetRef');
      const sl=level.get(src)||0, tl=level.get(tgt)||0;
      if(sl>0 && tl>0 && tl<sl) level.set(tgt,sl);
    });
  }

  // ================================================================
  // F3: sequenceFlow再伝播（収束保証）
  // ================================================================
  function propagate(seqs,level) {
    let changed=true,guard=0;
    while(changed&&guard++<2000) {
      changed=false;
      seqs.forEach(f=>{
        const sl=level.get(f.src)||0, tl=level.get(f.tgt)||0;
        if(tl<sl+1) { level.set(f.tgt,sl+1); changed=true; }
      });
    }
  }

  // ================================================================
  // F5-F8: Y座標計算
  // ================================================================
  function computeY(nodes,seqs,outMap,inMap,level,lanes,laneGeom) {
    const laneOfNode=new Map();
    lanes.forEach(l=>l.nodeIds.forEach(id=>laneOfNode.set(id,l.id)));
    function getGeom(id) {
      return laneGeom.get(laneOfNode.get(id))
          || laneGeom.get(null)
          || {top:0,bottom:200,centerY:100,h:200};
    }

    // トポロジカルソート
    const topo=topoSort(nodes.map(n=>n.id),outMap);

    // F5: 重み付き親平均
    const desired=new Map(), yPos=new Map();
    topo.forEach(id=>{
      const parents=inMap.get(id)||[];
      const geom=getGeom(id);
      if(parents.length===0) {
        desired.set(id,geom.centerY);
      } else {
        let sum=0,tw=0;
        parents.forEach(pid=>{
          let w=1;
          const pn=nodes.find(n=>n.id===pid);
          if(pn&&!pn.tag.includes('Gateway')&&!pn.tag.includes('Event')) w+=2;
          if((level.get(pid)||0)===(level.get(id)||0)-1) w+=2;
          sum+=(yPos.get(pid)??getGeom(pid).centerY)*w; tw+=w;
        });
        desired.set(id,sum/tw);
      }
      yPos.set(id,desired.get(id));
    });

    // F6: Lane内衝突回避
    function resolveCollisions(once) {
      lanes.forEach(lane=>{
        const geom=laneGeom.get(lane.id)||laneGeom.get(null); if(!geom) return;
        const lnodes=[...lane.nodeIds].filter(id=>nodes.some(n=>n.id===id));
        // levelでグループ → desiredYでソート → 間隔確保
        const groups=new Map();
        lnodes.forEach(id=>{
          const lv=level.get(id)||1;
          if(!groups.has(lv)) groups.set(lv,[]);
          groups.get(lv).push(id);
        });
        groups.forEach(grp=>{
          grp.sort((a,b)=>(desired.get(a)||0)-(desired.get(b)||0));
          let curY=geom.top+LANE_PAD_Y;
          grp.forEach(id=>{
            const {h}=nodeSize(nodes.find(n=>n.id===id)?.tag);
            const want=once?yPos.get(id):desired.get(id);
            const y=Math.max(want??geom.centerY,curY);
            const clamped=Math.min(y,geom.bottom-LANE_PAD_Y-h);
            yPos.set(id,Math.max(clamped,geom.top+LANE_PAD_Y));
            curY=(yPos.get(id)||geom.top)+h+NODE_MARGIN;
          });
        });
      });
    }
    resolveCollisions(false);

    // F7: レーン間整列（同levelのY平均）
    const lvGroups=new Map();
    nodes.forEach(n=>{ const lv=level.get(n.id)||1;
      if(!lvGroups.has(lv)) lvGroups.set(lv,[]);
      lvGroups.get(lv).push(n.id); });
    lvGroups.forEach(gids=>{
      if(gids.length<2) return;
      const avg=gids.reduce((s,id)=>s+(yPos.get(id)||0),0)/gids.length;
      gids.forEach(id=>{
        const geom=getGeom(id);
        const {h}=nodeSize(nodes.find(n=>n.id===id)?.tag);
        const c=Math.max(geom.top+LANE_PAD_Y,Math.min(avg,geom.bottom-LANE_PAD_Y-h));
        yPos.set(id,c);
        desired.set(id,c); // 整列後の値をdesiredにも反映
      });
    });

    // F8: 再衝突回避
    resolveCollisions(true);

    return yPos;
  }

  function topoSort(ids,outMap) {
    const inDeg=new Map(ids.map(id=>[id,0]));
    ids.forEach(id=>(outMap.get(id)||[]).forEach(nx=>{
      if(inDeg.has(nx)) inDeg.set(nx,(inDeg.get(nx)||0)+1);
    }));
    const q=ids.filter(id=>(inDeg.get(id)||0)===0), res=[], vis=new Set();
    while(q.length) {
      const id=q.shift(); if(vis.has(id)) continue;
      vis.add(id); res.push(id);
      (outMap.get(id)||[]).forEach(nx=>{
        if(!inDeg.has(nx)) return;
        const d=(inDeg.get(nx)||1)-1; inDeg.set(nx,d);
        if(d<=0&&!vis.has(nx)) q.push(nx);
      });
    }
    ids.forEach(id=>{ if(!vis.has(id)) res.push(id); });
    return res;
  }

  // Lane高さ推定
  function estLaneH(lane,nodes,level) {
    const lnodes=[...lane.nodeIds].filter(id=>nodes.some(n=>n.id===id));
    if(!lnodes.length) return LANE_MIN_H;
    const cnt=new Map();
    lnodes.forEach(id=>{ const lv=level.get(id)||1; cnt.set(lv,(cnt.get(lv)||0)+1); });
    const maxPer=Math.max(...cnt.values(),1);
    return Math.max(LANE_MIN_H, maxPer*(TASK_H+NODE_MARGIN)+LANE_PAD_Y*2);
  }

  // ================================================================
  // プロセス単体レイアウト
  // ================================================================
  function layoutProc(proc,allLevel,msgFlows,partOffsetY) {
    const {nodes,nids,seqs,outMap,inMap,lanes}=collectProcess(proc);
    if(!nodes.length) return {laneGeomMap:new Map(),totalH:LANE_MIN_H,maxX:300};

    // 全体level（既に計算済みのものを使う）
    const level=allLevel;

    // Lane geom（仮）
    const laneGeomMap=new Map();
    let curY=partOffsetY;
    lanes.forEach(lane=>{
      const h=estLaneH(lane,nodes,level);
      laneGeomMap.set(lane.id,{top:curY,bottom:curY+h,centerY:curY+h/2,h});
      curY+=h;
    });
    const totalH=curY-partOffsetY;

    // F5-F8: Y座標
    const yPos=computeY(nodes,seqs,outMap,inMap,level,lanes,laneGeomMap);

    // F4: X座標 → Shape生成
    let maxX=PART_LABEL_W+LANE_LABEL_W+LANE_PAD_X;
    nodes.forEach(n=>{
      const lv=level.get(n.id)||1;
      const x=PART_LABEL_W+LANE_LABEL_W+LANE_PAD_X+(lv-1)*X_SPACING;
      const y=yPos.get(n.id)??laneGeomMap.values().next().value?.centerY??partOffsetY;
      const {w,h}=nodeSize(n.tag);
      mkShape(n.id,x,y-h/2,w,h);
      maxX=Math.max(maxX,x+w);
    });
    return {laneGeomMap,totalH,maxX};
  }

  // ================================================================
  // F9: sequenceFlow waypoint
  // ================================================================
  function seqWP(s,t) {
    const sx=s.x+s.w, sy=s.y+s.h/2;
    const tx=t.x,      ty=t.y+t.h/2;
    if(Math.abs(sy-ty)<2) return [[sx,sy],[tx,ty]];
    if(sx<=tx) { const mx=(sx+tx)/2; return [[sx,sy],[mx,sy],[mx,ty],[tx,ty]]; }
    // ループバック
    const ex=Math.min(s.x,t.x+t.w)-20;
    return [[s.x,sy],[ex,sy],[ex,ty],[t.x+t.w,ty]];
  }

  // ================================================================
  // F10: messageFlow waypoint（Pool境界 + Manhattan + オフセット）
  // ================================================================
  function msgWP(s,t,sPool,tPool,idx) {
    const off=idx%2===0?MSG_OFFSET:-MSG_OFFSET;
    const sx=s.x+s.w/2, tx=t.x+t.w/2;
    const sy=sPool?(s.y<t.y?sPool.bottom:sPool.top):(s.y+s.h/2);
    const ty=tPool?(s.y<t.y?tPool.top:tPool.bottom):(t.y+t.h/2);
    if(Math.abs(sx-tx)<2) return [[sx+off,sy],[tx+off,ty]];
    const my=(sy+ty)/2;
    return [[sx+off,sy],[sx+off,my],[tx+off,my],[tx+off,ty]];
  }

  // ================================================================
  // メイン処理
  // ================================================================
  if(collab) {
    const parts=[...collab.querySelectorAll('participant')];
    const msgFlows=[...collab.querySelectorAll('messageFlow')];

    // ---- 全ノードのlevelを統合計算 ----
    // 各プロセスのBFSを実行→全てのlevelをマージ
    const globalLevel=new Map();
    const allSeqs=[];
    parts.forEach(part=>{
      const proc=doc.querySelector('process[id="'+part.getAttribute('processRef')+'"]');
      if(!proc) return;
      const {nodes,seqs,outMap,inMap}=collectProcess(proc);
      const lv=bfsLevels(nodes,seqs,outMap,inMap);
      lv.forEach((v,k)=>globalLevel.set(k,v));
      seqs.forEach(s=>allSeqs.push(s));
    });

    // F2: messageFlow制約（全Participant横断）
    applyMsgConstraints(globalLevel,msgFlows,null);

    // F3: 全sequenceFlow再伝播
    propagate(allSeqs,globalLevel);

    // ---- 1パス目: 各Participantレイアウト ----
    let curY=0;
    const partInfos=[];
    parts.forEach(part=>{
      const pid=part.getAttribute('id');
      const proc=doc.querySelector('process[id="'+part.getAttribute('processRef')+'"]');
      const {laneGeomMap,totalH,maxX}=proc
        ? layoutProc(proc,globalLevel,msgFlows,curY)
        : {laneGeomMap:new Map(),totalH:LANE_MIN_H,maxX:300};
      partInfos.push({pid,partY:curY,totalH,maxX,laneGeomMap,proc});
      curY+=totalH+PART_V_GAP;
    });

    // 全Participantの幅を揃える
    const globalMaxX=Math.max(...partInfos.map(p=>p.maxX),400)+LANE_PAD_X;

    // ---- Participant/Lane Shape生成 ----
    partInfos.forEach(({pid,partY,totalH,laneGeomMap,proc})=>{
      mkShape(pid,0,partY,globalMaxX,totalH,{isHorizontal:'true'});
      if(proc) {
        proc.querySelectorAll('lane').forEach(lane=>{
          const lid=lane.getAttribute('id');
          const g=laneGeomMap.get(lid); if(!g) return;
          mkShape(lid,PART_LABEL_W,g.top,globalMaxX-PART_LABEL_W,g.h,{isHorizontal:'true'});
        });
      }
    });

    // ---- ノード→Participant/Poolマップ ----
    const nodeToPool=new Map();
    partInfos.forEach(({pid,proc})=>{
      if(!proc) return;
      FLOW_TAGS.forEach(tag=>proc.querySelectorAll(tag).forEach(el=>{
        nodeToPool.set(el.getAttribute('id'),pid);
      }));
    });
    const poolBounds=new Map();
    partInfos.forEach(({pid,partY,totalH})=>poolBounds.set(pid,{top:partY,bottom:partY+totalH}));

    // F9: sequenceFlow描画
    doc.querySelectorAll('sequenceFlow').forEach(f=>{
      const fid=f.getAttribute('id');
      const s=nodeBounds.get(f.getAttribute('sourceRef'));
      const t=nodeBounds.get(f.getAttribute('targetRef'));
      if(s&&t) mkEdge(fid,seqWP(s,t));
    });

    // F10: messageFlow描画
    msgFlows.forEach((mf,idx)=>{
      const fid=mf.getAttribute('id');
      const s=nodeBounds.get(mf.getAttribute('sourceRef'));
      const t=nodeBounds.get(mf.getAttribute('targetRef'));
      if(!s||!t) return;
      const sp=poolBounds.get(nodeToPool.get(mf.getAttribute('sourceRef')));
      const tp=poolBounds.get(nodeToPool.get(mf.getAttribute('targetRef')));
      mkEdge(fid,msgWP(s,t,sp,tp,idx),{messageVisibleKind:'non_initiating'});
    });

  } else {
    // 単一プロセス
    const proc=doc.querySelector('process');
    if(proc) {
      const {nodes,seqs,outMap,inMap,lanes}=collectProcess(proc);
      const level=bfsLevels(nodes,seqs,outMap,inMap);
      propagate(seqs,level);

      const laneGeomMap=new Map();
      let curY=0;
      lanes.forEach(lane=>{
        const h=estLaneH(lane,nodes,level);
        laneGeomMap.set(lane.id,{top:curY,bottom:curY+h,centerY:curY+h/2,h});
        curY+=h;
      });

      const yPos=computeY(nodes,seqs,outMap,inMap,level,lanes,laneGeomMap);

      nodes.forEach(n=>{
        const lv=level.get(n.id)||1;
        const x=LANE_PAD_X+(lv-1)*X_SPACING;
        const y=yPos.get(n.id)??laneGeomMap.values().next().value?.centerY??50;
        const {w,h}=nodeSize(n.tag);
        mkShape(n.id,x,y-h/2,w,h);
      });

      // Lane Shapeがある場合は生成
      const laneEls=[...proc.querySelectorAll('lane')];
      if(laneEls.length>0) {
        let maxX=LANE_PAD_X;
        nodes.forEach(n=>{ const b=nodeBounds.get(n.id); if(b) maxX=Math.max(maxX,b.x+b.w); });
        const totalW=maxX+LANE_PAD_X;
        laneEls.forEach(lane=>{
          const lid=lane.getAttribute('id'), g=laneGeomMap.get(lid); if(!g) return;
          mkShape(lid,LANE_LABEL_W,g.top,totalW,g.h,{isHorizontal:'true'});
        });
      }

      doc.querySelectorAll('sequenceFlow').forEach(f=>{
        const fid=f.getAttribute('id');
        const s=nodeBounds.get(f.getAttribute('sourceRef'));
        const t=nodeBounds.get(f.getAttribute('targetRef'));
        if(s&&t) mkEdge(fid,seqWP(s,t));
      });
    }
  }

  // 名前空間プレフィックス正規化
  let out=serializer.serializeToString(doc);
  const nsMap={
    'http://www.omg.org/spec/BPMN/20100524/MODEL':'bpmn2',
    'http://www.omg.org/spec/BPMN/20100524/DI':'bpmndi',
    'http://www.omg.org/spec/DD/20100524/DC':'dc',
    'http://www.omg.org/spec/DD/20100524/DI':'di',
  };
  const remap={};
  let m, pat=/xmlns:([a-zA-Z0-9_]+)="([^"]+)"/g;
  while((m=pat.exec(out))!==null) {
    const[,pfx,uri]=m, c=nsMap[uri];
    if(c&&pfx!==c) remap[pfx]=c;
  }
  for(const[o,n]of Object.entries(remap)) {
    out=out.replace(new RegExp('(</?|\\s)'+o+':','g'),'$1'+n+':');
    out=out.replace(new RegExp('xmlns:'+o+'=','g'),'xmlns:'+n+'=');
  }
  return out;
}

</script>
